<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flash Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; display: block; }
    #loading {
      position: fixed; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: #111; color: #fff; font-family: sans-serif; gap: 16px;
      z-index: 10;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #333;
      border-top-color: #f60; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Запуск Flash-эмулятора...</p>
  </div>
  <div id="player"></div>

  <script>
    // Load Ruffle from local static file
    var script = document.createElement('script');
    script.src = './ruffle/ruffle.js';
    script.onload = function() {
      setTimeout(function() {
        try {
          var ruffle = window.RufflePlayer.newest();
          var player = ruffle.createPlayer();
          player.style.width = '100%';
          player.style.height = '100%';
          player.style.display = 'block';
          var container = document.getElementById('player');
          container.appendChild(player);
          player.load({ url: './game.swf', allowScriptAccess: true });
          document.getElementById('loading').style.display = 'none';
        } catch(e) {
          document.getElementById('loading').innerHTML =
            '<p style="color:#f66">Ошибка: ' + e.message + '</p>';
        }
      }, 500);
    };
    script.onerror = function() {
      document.getElementById('loading').innerHTML =
        '<p style="color:#f66">Не удалось загрузить Ruffle</p>';
    };
    document.head.appendChild(script);
  </script>
</body>
</html>

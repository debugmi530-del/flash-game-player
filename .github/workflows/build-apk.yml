name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm packages (for Ruffle)
        run: npm install

      - name: Prepare Android assets (no build step needed)
        run: |
          mkdir -p android/app/src/main/assets/public/ruffle

          # 1. Copy the plain HTML player
          cp web/index.html android/app/src/main/assets/public/index.html

          # 2. Copy Ruffle JS/WASM files
          cp node_modules/@ruffle-rs/ruffle/* android/app/src/main/assets/public/ruffle/ 2>/dev/null || true

          # 3. Copy the game SWF
          cp game.swf android/app/src/main/assets/public/game.swf

          # Debug: show what we have
          echo "=== Assets ==="
          ls -lh android/app/src/main/assets/public/
          echo "=== Ruffle ==="
          ls -lh android/app/src/main/assets/public/ruffle/ | head -20

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flash-game-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
